<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer's Agent | Your Money, Your Decision</title>
  <style>
    :root {
      --green: #315b43;
      --dark: #202a24;
      --cream: #f7f6f0;
      --muted: #69736b;
      --lime: #dce8b4;
      --white: #fff;
      --border: #e0e4db;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--dark);
      line-height: 1.6;
    }

    a { text-decoration: none; color: inherit; }

    button, input, select { font: inherit; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 7%;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span { color: var(--green); }

    .nav-link {
      color: var(--muted);
      font-size: 14px;
      margin-left: 22px;
    }

    .nav-button {
      background: var(--green);
      color: white;
      padding: 10px 17px;
      border-radius: 30px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
      padding: 85px 7%;
      background: linear-gradient(115deg, var(--cream) 62%, #e9eee3 62%);
    }

    .eyebrow {
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1;
      letter-spacing: -4px;
      margin: 20px 0;
    }

    h1 span { color: var(--green); }

    .hero-text {
      color: var(--muted);
      font-size: 17px;
      max-width: 500px;
    }

    .button {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 30px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin: 10px 8px 0 0;
    }

    .button-primary {
      background: var(--green);
      color: white;
    }

    .button-secondary {
      background: white;
      border: 1px solid var(--border);
      color: var(--dark);
    }

    .trust {
      color: var(--muted);
      font-size: 12px;
      margin-top: 24px;
    }

    .example-card {
      background: white;
      border: 1px solid var(--border);
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 15px 45px #202a2410;
    }

    .card-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tag {
      background: var(--lime);
      color: var(--green);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
    }

    .product {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .product-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      background: #edf1e7;
      border-radius: 15px;
      font-size: 25px;
    }

    .product-info { flex: 1; }

    .product-info small {
      display: block;
      color: var(--muted);
    }

    .product-price {
      font-weight: 800;
      white-space: nowrap;
    }

    .recommendation {
      background: var(--green);
      color: white;
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
    }

    .recommendation small {
      color: var(--lime);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .recommendation h3 { margin: 5px 0; }

    .recommendation p {
      font-size: 13px;
      margin-bottom: 0;
      color: #e5ece5;
    }

    section {
      padding: 75px 7%;
    }

    .section-heading {
      max-width: 700px;
      margin-bottom: 30px;
    }

    h2 {
      font-size: clamp(32px, 4vw, 48px);
      letter-spacing: -2px;
      line-height: 1.1;
      margin: 12px 0;
    }

    .section-heading p,
    .step p,
    .principle p {
      color: var(--muted);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .step, .principle {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
    }

    .step-number {
      color: var(--green);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .step h3 { margin-bottom: 8px; }

    .tool-section { background: #e9eee3; }

    .tool-layout {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 40px;
      align-items: start;
    }

    .tool-intro p { color: var(--muted); }

    .privacy {
      border-left: 3px solid var(--green);
      padding-left: 15px;
      font-size: 13px;
      margin-top: 25px;
    }

    .form-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
    }

    .form-card > p {
      color: var(--muted);
      font-size: 13px;
    }

    .form-title {
      font-weight: bold;
      margin: 25px 0 12px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    input, select {
      min-width: 0;
      width: 100%;
      border: 1px solid #cfd6ca;
      border-radius: 10px;
      padding: 12px;
      background: white;
      color: var(--dark);
    }

    input:focus, select:focus {
      outline: 2px solid #9ab79f;
    }

    .form-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 22px;
      border-radius: 16px;
      background: #edf1e7;
      border: 1px solid #d4dfcb;
    }

    .result.show { display: block; }

    .
